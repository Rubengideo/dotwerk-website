<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Beheer | Dotwerk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ds/bundle.css">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="login" id="login" hidden>
  <div class="mo-card mo-card--padded login__card">
    <span data-dot='{"size":64,"shape":"circle","color":"cobalt"}' style="width:64px;height:64px"></span>
    <h1 class="heading-l">Beheer</h1>
    <p class="body-l" id="login-text">Log in met je GitHub-account om de pagina te bewerken.</p>
    <button class="mo-btn mo-btn--primary mo-btn--lg" type="button" id="btn-login">Inloggen met GitHub</button>
    <div id="login-msg" role="status" hidden></div>
    <a class="body-s" href="/">Terug naar de site</a>
  </div>
</div>

<div id="preview" hidden></div>

<button class="mo-btn mo-btn--primary admin-fab" id="admin-fab" type="button" hidden>
  <svg class="mo-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>Pagina bewerken
</button>

<aside class="drawer" id="drawer" aria-labelledby="drawer-title" hidden>
  <div class="drawer__head">
    <h2 class="heading-m" id="drawer-title">Beheer</h2>
    <button class="mo-btn mo-btn--ghost mo-btn--sm" type="button" id="btn-logout">Uitloggen</button>
    <button class="mo-iconbtn" type="button" id="drawer-close" aria-label="Beheer sluiten"><svg class="mo-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer__tabs">
    <div class="mo-tabs" role="tablist" aria-label="Beheeronderdelen">
      <button class="mo-tab" role="tab" type="button" id="tab-content" aria-selected="true" aria-controls="drawer-body">Inhoud</button>
      <button class="mo-tab" role="tab" type="button" id="tab-seo" aria-selected="false" aria-controls="drawer-body">SEO <span class="mo-tab__count" id="seo-count">0</span></button>
    </div>
  </div>
  <div class="drawer__body" id="drawer-body" role="tabpanel"></div>
  <div class="drawer__foot">
    <span class="drawer__state" id="drawer-state" role="status">Alles is gepubliceerd</span>
    <button class="mo-btn mo-btn--ghost" type="button" id="btn-discard" disabled>Weggooien</button>
    <button class="mo-btn mo-btn--primary" type="button" id="btn-save" disabled>Publiceren</button>
  </div>
</aside>

<script src="/ds/vendor/react.production.min.js"></script>
<script src="/ds/vendor/react-dom.production.min.js"></script>
<script src="/ds/bundle.js"></script>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
