# Decap CMS: bewerkt content/home.json en content/seo.json via GitHub.
# Elke opgeslagen wijziging is een commit op main; Vercel publiceert die automatisch.
backend:
  name: github
  repo: Rubengideo/dotwerk-website
  branch: main
  base_url: __SITE_ORIGIN__
  auth_endpoint: api/auth
  commit_messages:
    update: "Inhoud bijgewerkt: {{slug}}"

locale: nl
site_url: __SITE_ORIGIN__
display_url: __SITE_ORIGIN__
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: Website
    editor: { preview: false }
    files:
      - name: home
        label: Homepagina
        file: content/home.json
        format: json
        fields:
          - { name: brand, label: Bedrijfsnaam, widget: string }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Label boven de kop, widget: string }
              - { name: title, label: Hoofdkop (H1), widget: text }
              - { name: intro, label: Introductie, widget: text }
              - { name: ctaPrimary, label: Knop 1, widget: string }
              - { name: ctaSecondary, label: Knop 2, widget: string, required: false }
              - { name: proof, label: Pluspunten, widget: list, field: { name: item, label: Pluspunt, widget: string } }
          - { name: sectorsLabel, label: Label bij sectoren, widget: string }
          - { name: sectors, label: Sectoren, widget: list, field: { name: item, label: Sector, widget: string } }
          - name: services
            label: Diensten
            widget: object
            fields:
              - { name: eyebrow, label: Label, widget: string }
              - { name: title, label: Kop, widget: string }
              - { name: intro, label: Introductie, widget: text }
              - name: items
                label: Diensten
                label_singular: Dienst
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Naam, widget: string }
                  - { name: badge, label: Label, widget: string, required: false }
                  - { name: text, label: Omschrijving, widget: text }
                  - { name: bullets, label: Punten, widget: list, field: { name: item, label: Punt, widget: string } }
                  - { name: price, label: Prijs, widget: string }
                  - { name: priceNote, label: Toelichting bij prijs, widget: string, required: false }
                  - { name: featured, label: Uitgelicht (zwarte rand), widget: boolean, default: false }
          - name: steps
            label: Werkwijze
            widget: object
            fields:
              - { name: eyebrow, label: Label, widget: string }
              - { name: title, label: Kop, widget: string }
              - name: items
                label: Stappen
                label_singular: Stap
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Titel, widget: string }
                  - { name: text, label: Tekst, widget: text }
                  - { name: when, label: Wanneer, widget: string, required: false }
          - name: principles
            label: Zo werken we
            widget: object
            fields:
              - { name: eyebrow, label: Label, widget: string }
              - { name: title, label: Kop, widget: string }
              - { name: intro, label: Introductie, widget: text }
              - name: items
                label: Principes
                label_singular: Principe
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Titel, widget: string }
                  - { name: text, label: Tekst, widget: text }
          - name: case
            label: Case
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: meta, label: Klant, widget: string }
              - { name: quote, label: Citaat, widget: text }
              - { name: source, label: Bron, widget: text }
              - name: stats
                label: Cijfers
                label_singular: Cijfer
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { name: value, label: Waarde, widget: string }
                  - { name: label, label: Toelichting, widget: string }
          - name: faq
            label: Veelgestelde vragen
            widget: object
            fields:
              - { name: eyebrow, label: Label, widget: string }
              - { name: title, label: Kop, widget: string }
              - name: items
                label: Vragen
                label_singular: Vraag
                widget: list
                summary: "{{fields.q}}"
                fields:
                  - { name: q, label: Vraag, widget: string }
                  - { name: a, label: Antwoord, widget: text }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: title, label: Kop, widget: string }
              - { name: intro, label: Introductie, widget: text }
              - { name: email, label: E-mailadres, widget: string, required: false }
              - { name: hours, label: Bereikbaarheid, widget: string, required: false }
              - { name: formEndpoint, label: Formulieradres (Formspree), widget: string, required: false, hint: "Bijvoorbeeld https://formspree.io/f/abcdwxyz. Leeg laten betekent dat het formulier niets verstuurt." }
          - name: footer
            label: Voettekst
            widget: object
            fields:
              - { name: left, label: Links, widget: string }
              - { name: right, label: Rechts, widget: string, required: false }

      - name: seo
        label: SEO
        file: content/seo.json
        format: json
        fields:
          - { name: title, label: Paginatitel, widget: string, hint: "30 tot 60 tekens. Verschijnt als blauwe link in Google." }
          - { name: description, label: Metabeschrijving, widget: text, hint: "70 tot 160 tekens. De tekst onder je titel in Google." }
          - { name: keyword, label: Focuszoekwoord, widget: string, required: false }
          - { name: url, label: Adres van de site, widget: string, required: false, hint: "Leeg laten gebruikt het vercel.app-adres. Vul je eigen domein in zodra je dat hebt, bijvoorbeeld https://www.dotwerk.nl/" }
          - { name: index, label: Zoekmachines mogen de site opnemen, widget: boolean, default: false, hint: "Uit zolang de site nog een opzet is." }
          - { name: ogTitle, label: Titel bij delen op LinkedIn en WhatsApp, widget: string, required: false }
          - { name: ogDescription, label: Beschrijving bij delen, widget: text, required: false }
          - name: org
            label: Bedrijfsgegevens voor Google
            widget: object
            fields:
              - { name: name, label: Bedrijfsnaam, widget: string }
              - { name: city, label: Plaats, widget: string, required: false }
              - { name: email, label: E-mailadres, widget: string, required: false }
              - { name: phone, label: Telefoon, widget: string, required: false }
              - { name: kvk, label: KvK-nummer, widget: string, required: false }
